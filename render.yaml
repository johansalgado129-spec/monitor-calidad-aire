services:
  - type: web
    name: monitor-calidad-aire
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /salud
    envVars:
      - key: OPENAQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.7
